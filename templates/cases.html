{% extends "base.html" %}

{% block content %}
<section class="py-5 mt-5">
    <div class="container">
        <div class="row mb-5">
            <div class="col-lg-8 mx-auto text-center">
                <h1 class="display-5 fw-bold mb-3">Кейсы</h1>
                <p class="lead text-muted">Проекты и форматы решений, которые можно внедрить под вашу задачу</p>

        <div class="row g-4 justify-content-center cases-portfolio-grid">

            {% endfor %}
        </div>
    </div>

{% endblock %}
